<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Rekap Uang Masuk Harian</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; background: #f5f6fa; color: #222; }

  /* ===== MENU (titik tiga, sebaris dengan tab) ===== */
  .menu-wrap { position: relative; flex: 0 0 auto; margin: 0 0 6px 8px; }
  .menu-btn {
    background: #eef1f7;
    border: 1px solid #d8deea;
    color: #1f3b73;
    width: 30px; height: 30px; border-radius: 6px;
    font-size: 18px; line-height: 1; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s;
  }
  .menu-btn:hover { background: #dfe6f4; }

  .menu-dropdown {
    position: absolute; top: calc(100% + 4px); right: 0;
    background: #fff; color: #222;
    border: 1px solid #d8deea; border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.18);
    min-width: 300px; max-width: calc(100vw - 32px); padding: 10px 0;
    display: none;
  }
  .menu-dropdown.open { display: block; }
  .menu-dropdown .item { padding: 8px 16px; font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
  .menu-dropdown .item label { font-weight: 600; color: #1f3b73; font-size: 12px; }
  .menu-dropdown .item input[type=file],
  .menu-dropdown .item select {
    width: 100%; font-size: 13px; padding: 5px 6px;
    border: 1px solid #ccd; border-radius: 4px; background: #fff;
  }
  .menu-dropdown .divider { height: 1px; background: #e0e0e0; margin: 6px 0; }
  .menu-dropdown .actions { display: flex; gap: 8px; padding: 6px 16px; }
  .menu-dropdown .btn {
    flex: 1; padding: 7px 10px; font-size: 13px; border: none; border-radius: 4px; cursor: pointer;
  }
  .menu-dropdown .btn.primary { background: #1f3b73; color: #fff; }
  .menu-dropdown .btn.primary:disabled { background: #aab; cursor: not-allowed; }
  .menu-dropdown .btn.ghost { background: #eef1f7; color: #1f3b73; border: 1px solid #d8deea; }
  .menu-dropdown .status {
    padding: 8px 16px 4px; font-size: 12px; color: #555;
    border-top: 1px solid #eee; margin-top: 6px;
  }

  /* ===== CARDS ===== */
  .cards {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
    padding: 12px 24px 0;
    background: #fff;
  }
  .card {
    background: #fff;
    border: 1px solid #e0e4ee;
    border-left: 3px solid #1f3b73;
    border-radius: 6px;
    padding: 8px 12px;
    display: flex; flex-direction: column; gap: 2px;
    min-width: 0;
  }
  .card .label {
    font-size: 11px; color: #667; text-transform: uppercase;
    letter-spacing: .4px; font-weight: 600;
  }
  .card .value {
    font-size: 14px; font-weight: 700; color: #1f3b73;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card .sub { font-size: 11px; color: #889; }
  .card.c-minyak    { border-left-color: #2e7d32; }
  .card.c-minyak    .value { color: #2e7d32; }
  .card.c-rupa      { border-left-color: #ef6c00; }
  .card.c-rupa      .value { color: #ef6c00; }
  .card.c-grand     { border-left-color: #c62828; background: #fff8f8; }
  .card.c-grand     .value { color: #c62828; font-size: 15px; }

  /* ===== TABS ===== */
  .tabbar {
    display: flex; align-items: flex-start;
    padding: 12px 24px 0;
    background: #fff; border-bottom: 1px solid #e0e0e0;
    position: sticky; top: 0; z-index: 30;
  }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 auto; min-width: 0; }
  .tab {
    padding: 8px 14px; background: #eef1f7; border: 1px solid #d8deea;
    border-bottom: none; border-radius: 6px 6px 0 0;
    font-size: 13px; cursor: pointer;
  }
  .tab.active { background: #1f3b73; color: #fff; border-color: #1f3b73; }

  .panel { display: none; padding: 16px 24px 32px; }
  .panel.active { display: block; }
  .panel .summary { font-size: 12px; color: #555; margin-bottom: 8px; }
  table { border-collapse: collapse; width: 100%; background: #fff; font-size: 12px; }
  th, td { border: 1px solid #e0e0e0; padding: 6px 8px; text-align: left; vertical-align: top; white-space: nowrap; }
  th { background: #f0f3fa; position: sticky; top: 0; z-index: 1; }
  td.num, th.num { text-align: right; }
  tbody tr:nth-child(even) { background: #fafbfe; }
  .table-wrap { max-height: 70vh; overflow: auto; border: 1px solid #e0e0e0; border-radius: 6px; }
  .empty { padding: 32px; text-align: center; color: #888; font-size: 13px; }

  /* ===== PAGER ===== */
  .pager {
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    padding: 8px 10px; font-size: 12px; background: #fff;
    position: sticky; bottom: 0; border-top: 1px solid #e0e0e0;
  }
  .pager button {
    padding: 5px 10px; font-size: 12px; border: 1px solid #ccd; background: #eef1f7;
    color: #1f3b73; border-radius: 4px; cursor: pointer;
  }
  .pager button:disabled { opacity: .4; cursor: not-allowed; }
  .pager button:hover:not(:disabled) { background: #dfe6f4; }
  .pager .info { color: #555; margin-left: auto; }

  @media (max-width: 720px) {
    .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>


<!-- ===== CARDS RINGKASAN ===== -->
<div class="cards" id="cards">
  <div class="card">
    <div class="label">Total Faktur</div>
    <div class="value" id="cardFaktur">Rp 0</div>
    <div class="sub" id="cardFakturSub">0 transaksi</div>
  </div>
  <div class="card c-minyak">
    <div class="label">Total Minyak</div>
    <div class="value" id="cardMinyak">Rp 0</div>
    <div class="sub" id="cardMinyakSub">Cash: 0 • TF: 0</div>
  </div>
  <div class="card c-rupa">
    <div class="label">Total Rupa-Rupa</div>
    <div class="value" id="cardRupa">Rp 0</div>
    <div class="sub" id="cardRupaSub">Cash: 0 • TF: 0</div>
  </div>
  <div class="card c-grand">
    <div class="label">Grand Total</div>
    <div class="value" id="cardGrand">Rp 0</div>
    <div class="sub" id="cardGrandSub">Cash: 0 • TF: 0</div>
  </div>
</div>

<div class="tabbar">
  <div class="tabs" id="tabs"></div>
  <div class="menu-wrap">
    <button class="menu-btn" id="menuBtn" title="Menu">&#8942;</button>
<div class="menu-dropdown" id="menuDropdown">
    <div class="item">
      <label>File Excel</label>
      <input type="file" id="fileInput" accept=".xlsx,.xls">
    </div>

    <div class="divider"></div>

    <div class="item">
      <label>Filter Bulan</label>
      <select id="filterBulan"><option value="">Semua</option></select>
    </div>
    <div class="item">
      <label>Filter Tanggal</label>
      <select id="filterTanggal"><option value="">Semua</option></select>
    </div>

    <div class="divider"></div>

    <div class="actions">
      <button class="btn ghost" id="btnReset">Reset</button>
      <button class="btn primary" id="btnExport" disabled>Export ke Excel</button>
    </div>

    <div class="status" id="status">Belum ada file.</div>
  </div>
  </div>
</div>
<div id="panels"></div>

<script>
const BULAN_NAMA = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

const TABS = [
  { id: "detail",    label: "Data Detail",                cols: ["tanggal","bulan","section","sales","no_faktur","nama_toko","alamat","tagihan_nominal","minyak_cash","minyak_transfer","rupa_cash","rupa_transfer","total_pembayaran","ket"] },
  { id: "harian",    label: "Rekap Harian",                cols: ["tanggal","bulan","jml_transaksi","total_tagihan","minyak_cash","minyak_transfer","rupa_cash","rupa_transfer","total_pembayaran"] },
  { id: "piutang",   label: "Piutang Tempo",               cols: ["tanggal","bulan","sales","no_faktur","nama_toko","alamat","tagihan_nominal","minyak_cash","minyak_transfer","rupa_cash","rupa_transfer","total_pembayaran","ket"] },
  { id: "dropping",  label: "Cash Dropping",               cols: ["tanggal","bulan","sales","no_faktur","nama_toko","alamat","tagihan_nominal","minyak_cash","minyak_transfer","rupa_cash","rupa_transfer","total_pembayaran","ket"] },
  { id: "minyak",    label: "Rekap Minyak & Rupa2",        cols: ["tanggal","bulan","minyak_cash","minyak_transfer","rupa_cash","rupa_transfer","total_minyak","total_rupa","total_cash","total_transfer"] },
  { id: "toko",      label: "Rekap per Toko",              cols: ["nama_toko","alamat","jml_transaksi","total_tagihan","minyak_cash","minyak_transfer","rupa_cash","rupa_transfer","total_pembayaran"] },
  { id: "tokoleng",  label: "Rekap Toko+Sales+Tanggal",    cols: ["tanggal","bulan","sales","nama_toko","alamat","section","jml_transaksi","total_tagihan","minyak_cash","minyak_transfer","rupa_cash","rupa_transfer","total_pembayaran"] },
  { id: "saleslst",  label: "Daftar Toko per Sales",       cols: ["tanggal","bulan","sales","daftar_toko","jml_toko","total_pembayaran"] },
  { id: "bulanan",   label: "Data Bulanan",                cols: ["bulan","jml_transaksi","jml_hari","jml_toko","total_tagihan","minyak_cash","minyak_transfer","rupa_cash","rupa_transfer","total_minyak","total_rupa","total_cash","total_transfer","total_pembayaran"] },
];

const NUM_COLS = new Set(["tagihan_nominal","minyak_cash","minyak_transfer","rupa_cash","rupa_transfer","total_pembayaran","jml_transaksi","total_tagihan","total_minyak","total_rupa","total_cash","total_transfer","jml_toko","jml_hari"]);

/* Peta tabId -> key pada state.views */
const VIEW_KEY = {
  detail: "detail", harian: "harian", piutang: "piutang", dropping: "dropping",
  minyak: "minyak", toko: "toko", tokoleng: "tokoSalesTgl",
  saleslst: "salesList", bulanan: "bulanan"
};

const PAGE_SIZE = 500;

const state = {
  records: [],
  views: null,
  rendered: {},   // { tabId: true/false }
  dirty: {},      // { tabId: true/false }
  page: {}        // { tabId: pageNumber }
};

function num(v) {
  if (v === null || v === undefined || v === "") return 0;
  if (typeof v === "number") return v;
  const s = String(v).replace(/[^\d.-]/g, "");
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function resolvePay(val, tagihan) {
  if (val === null || val === undefined || val === "") return 0;
  if (typeof val === "number") return val;
  const s = String(val).trim();
  if (/^=I\d+/i.test(s)) return tagihan;
  if (s.startsWith("=")) return 0;
  return num(s);
}
function fmt(n) {
  if (typeof n !== "number") return n ?? "";
  if (Number.isInteger(n)) return n.toLocaleString("id-ID");
  return n.toLocaleString("id-ID", {maximumFractionDigits: 2});
}
function rp(n) { return "Rp " + fmt(n || 0); }

function parseSheetDate(sheetName) {
  const m = String(sheetName).match(/^(\d{1,2})[-/](\d{1,2})/);
  if (!m) return { tanggal: sheetName, bulanNum: 0, bulanLabel: sheetName, tglSort: 0 };
  const d = parseInt(m[1], 10);
  const mo = parseInt(m[2], 10);
  const label = `${String(d).padStart(2,"0")}/${String(mo).padStart(2,"0")}`;
  const bulanLabel = BULAN_NAMA[mo-1] || `Bulan-${mo}`;
  return { tanggal: label, bulanNum: mo, bulanLabel, tglSort: mo*100 + d };
}

function parseWorkbook(wb) {
  const records = [];
  for (const sheetName of wb.SheetNames) {
    if (sheetName.toUpperCase() === "SHEET") continue;
    const info = parseSheetDate(sheetName);
    const ws = wb.Sheets[sheetName];
    /* blankrows:false memangkas baris kosong -> parsing file besar lebih ringan */
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: false });
    let section = null;
    let currentSales = null;

    for (const row of rows) {
      const vals = row || [];
      const text = vals.filter(v => v !== null && v !== undefined).join(" ").toUpperCase();

      if (text.includes("PIUTANG TEMPO")) { section = "PIUTANG TEMPO"; currentSales = null; continue; }
      if (text.includes("CASH DROPPING")) { section = "CASH DROPPING"; currentSales = null; continue; }
      if (text.includes("UANG MASUK DARI PIUTANG") || text.includes("UANG MASUK CASH") || text.includes("TOTAL UANG MASUK")) { section = null; continue; }
      if (!section) continue;

      const b = String(vals[1] ?? "").trim().toUpperCase();
      if (b === "NO" || b === "SALES" || b === "DROPPING/SALES") continue;
      if (String(vals[0] ?? "").trim().toUpperCase() === "TOTAL") continue;
      if (!vals[2] && !vals[3] && !vals[8]) continue;

      if (vals[1] && !["", "NAN"].includes(b) && !["SALES","DROPPING/SALES"].includes(b)) {
        currentSales = String(vals[1]).trim();
      }

      const tagihan = num(vals[8]);
      const mc = resolvePay(vals[9], tagihan);
      const mt = resolvePay(vals[10], tagihan);
      const rc = resolvePay(vals[11], tagihan);
      const rt = resolvePay(vals[12], tagihan);

      records.push({
        sheet: sheetName,
        tanggal: info.tanggal,
        bulan: info.bulanLabel,
        bulanNum: info.bulanNum,
        tglSort: info.tglSort,
        section,
        sales: currentSales,
        no_faktur: vals[2] ?? "",
        nama_toko: String(vals[3] ?? "").trim(),
        alamat: String(vals[4] ?? "").trim(),
        tagihan_nominal: tagihan,
        minyak_cash: mc,
        minyak_transfer: mt,
        rupa_cash: rc,
        rupa_transfer: rt,
        total_pembayaran: mc + mt + rc + rt,
        ket: vals[13] ?? "",
      });
    }
  }
  return records;
}

function buildViews(records) {
  const detail = records.slice().sort((a,b)=> a.tglSort-b.tglSort);

  const harianMap = {};
  for (const r of records) {
    const k = r.bulan + "|" + r.tanggal;
    if (!harianMap[k]) harianMap[k] = { tanggal: r.tanggal, bulan: r.bulan, tglSort: r.tglSort, jml_transaksi: 0, total_tagihan: 0, minyak_cash: 0, minyak_transfer: 0, rupa_cash: 0, rupa_transfer: 0, total_pembayaran: 0 };
    const o = harianMap[k];
    o.jml_transaksi++;
    o.total_tagihan += r.tagihan_nominal;
    o.minyak_cash += r.minyak_cash;
    o.minyak_transfer += r.minyak_transfer;
    o.rupa_cash += r.rupa_cash;
    o.rupa_transfer += r.rupa_transfer;
    o.total_pembayaran += r.total_pembayaran;
  }
  const harian = Object.values(harianMap).sort((a,b)=> a.tglSort-b.tglSort);

  const piutang = records.filter(r => r.section === "PIUTANG TEMPO").sort((a,b)=> a.tglSort-b.tglSort);
  const dropping = records.filter(r => r.section === "CASH DROPPING").sort((a,b)=> a.tglSort-b.tglSort);

  const minyakMap = {};
  for (const r of records) {
    const k = r.bulan + "|" + r.tanggal;
    if (!minyakMap[k]) minyakMap[k] = { tanggal: r.tanggal, bulan: r.bulan, tglSort: r.tglSort, minyak_cash: 0, minyak_transfer: 0, rupa_cash: 0, rupa_transfer: 0 };
    const o = minyakMap[k];
    o.minyak_cash += r.minyak_cash;
    o.minyak_transfer += r.minyak_transfer;
    o.rupa_cash += r.rupa_cash;
    o.rupa_transfer += r.rupa_transfer;
  }
  const minyak = Object.values(minyakMap).map(o => ({
    ...o,
    total_minyak: o.minyak_cash + o.minyak_transfer,
    total_rupa: o.rupa_cash + o.rupa_transfer,
    total_cash: o.minyak_cash + o.rupa_cash,
    total_transfer: o.minyak_transfer + o.rupa_transfer,
  })).sort((a,b)=> a.tglSort-b.tglSort);

  const tokoMap = {};
  for (const r of records) {
    const k = (r.nama_toko || "") + "|||" + (r.alamat || "");
    if (!tokoMap[k]) tokoMap[k] = { nama_toko: r.nama_toko, alamat: r.alamat, jml_transaksi: 0, total_tagihan: 0, minyak_cash: 0, minyak_transfer: 0, rupa_cash: 0, rupa_transfer: 0, total_pembayaran: 0 };
    const o = tokoMap[k];
    o.jml_transaksi++;
    o.total_tagihan += r.tagihan_nominal;
    o.minyak_cash += r.minyak_cash;
    o.minyak_transfer += r.minyak_transfer;
    o.rupa_cash += r.rupa_cash;
    o.rupa_transfer += r.rupa_transfer;
    o.total_pembayaran += r.total_pembayaran;
  }
  const toko = Object.values(tokoMap).sort((a,b)=> b.total_pembayaran - a.total_pembayaran);

  const tstMap = {};
  for (const r of records) {
    const k = [r.bulan, r.tanggal, r.sales||"", r.nama_toko||"", r.alamat||"", r.section].join("|||");
    if (!tstMap[k]) tstMap[k] = { tanggal: r.tanggal, bulan: r.bulan, tglSort: r.tglSort, sales: r.sales, nama_toko: r.nama_toko, alamat: r.alamat, section: r.section, jml_transaksi: 0, total_tagihan: 0, minyak_cash: 0, minyak_transfer: 0, rupa_cash: 0, rupa_transfer: 0, total_pembayaran: 0 };
    const o = tstMap[k];
    o.jml_transaksi++;
    o.total_tagihan += r.tagihan_nominal;
    o.minyak_cash += r.minyak_cash;
    o.minyak_transfer += r.minyak_transfer;
    o.rupa_cash += r.rupa_cash;
    o.rupa_transfer += r.rupa_transfer;
    o.total_pembayaran += r.total_pembayaran;
  }
  const tokoSalesTgl = Object.values(tstMap).sort((a,b)=>{
    const d = a.tglSort-b.tglSort;
    if (d) return d;
    const s = String(a.sales||"").localeCompare(String(b.sales||""));
    if (s) return s;
    return String(a.nama_toko||"").localeCompare(String(b.nama_toko||""));
  });

  const dstMap = {};
  for (const r of records) {
    const k = r.bulan + "|" + r.tanggal + "|" + (r.sales||"");
    if (!dstMap[k]) dstMap[k] = { tanggal: r.tanggal, bulan: r.bulan, tglSort: r.tglSort, sales: r.sales, _tokoSet: new Set(), total_pembayaran: 0 };
    const o = dstMap[k];
    if (r.nama_toko) o._tokoSet.add(r.nama_toko);
    o.total_pembayaran += r.total_pembayaran;
  }
  const salesList = Object.values(dstMap).map(o => ({
    tanggal: o.tanggal,
    bulan: o.bulan,
    sales: o.sales,
    daftar_toko: [...o._tokoSet].sort().join(", "),
    jml_toko: o._tokoSet.size,
    total_pembayaran: o.total_pembayaran,
  })).sort((a,b)=>{
    const d = a.tglSort-b.tglSort;
    if (d) return d;
    return String(a.sales||"").localeCompare(String(b.sales||""));
  });

  const bulanMap = {};
  for (const r of records) {
    const k = r.bulan;
    if (!bulanMap[k]) bulanMap[k] = {
      bulan: r.bulan, bulanNum: r.bulanNum,
      jml_transaksi: 0, _hariSet: new Set(), _tokoSet: new Set(),
      total_tagihan: 0, minyak_cash: 0, minyak_transfer: 0,
      rupa_cash: 0, rupa_transfer: 0, total_pembayaran: 0
    };
    const o = bulanMap[k];
    o.jml_transaksi++;
    o._hariSet.add(r.tanggal);
    if (r.nama_toko) o._tokoSet.add(r.nama_toko);
    o.total_tagihan += r.tagihan_nominal;
    o.minyak_cash += r.minyak_cash;
    o.minyak_transfer += r.minyak_transfer;
    o.rupa_cash += r.rupa_cash;
    o.rupa_transfer += r.rupa_transfer;
    o.total_pembayaran += r.total_pembayaran;
  }
  const bulanan = Object.values(bulanMap).map(o => ({
    bulan: o.bulan,
    jml_transaksi: o.jml_transaksi,
    jml_hari: o._hariSet.size,
    jml_toko: o._tokoSet.size,
    total_tagihan: o.total_tagihan,
    minyak_cash: o.minyak_cash,
    minyak_transfer: o.minyak_transfer,
    rupa_cash: o.rupa_cash,
    rupa_transfer: o.rupa_transfer,
    total_minyak: o.minyak_cash + o.minyak_transfer,
    total_rupa: o.rupa_cash + o.rupa_transfer,
    total_cash: o.minyak_cash + o.rupa_cash,
    total_transfer: o.minyak_transfer + o.rupa_transfer,
    total_pembayaran: o.total_pembayaran,
  })).sort((a,b)=> a.bulanNum - b.bulanNum);

  return { detail, harian, piutang, dropping, minyak, toko, tokoSalesTgl, salesList, bulanan };
}

function applyFilter(records) {
  const fBulan = document.getElementById("filterBulan").value;
  const fTanggal = document.getElementById("filterTanggal").value;
  return records.filter(r => {
    if (fBulan && r.bulan !== fBulan) return false;
    if (fTanggal && r.tanggal !== fTanggal) return false;
    return true;
  });
}

function refreshFilterOptions(allRecords, preferLastMonth) {
  const bulanSel = document.getElementById("filterBulan");
  const bulanSet = new Map();
  for (const r of allRecords) {
    if (r.bulanNum) bulanSet.set(r.bulan, r.bulanNum);
  }
  const bulanList = [...bulanSet.entries()].sort((a,b)=> a[1]-b[1]);
  bulanSel.innerHTML = `<option value="">Semua</option>` +
    bulanList.map(([label]) => `<option value="${label}">${label}</option>`).join("");

  /* Default: pilih bulan terakhir yang ada di data (jika ada > 1 bulan) */
  if (preferLastMonth && bulanList.length > 1) {
    const lastLabel = bulanList[bulanList.length - 1][0];
    bulanSel.value = lastLabel;
  } else {
    bulanSel.value = "";
  }

  refreshTanggalOptions(allRecords);
}

function refreshTanggalOptions(allRecords) {
  const fBulan = document.getElementById("filterBulan").value;
  const tglSel = document.getElementById("filterTanggal");
  const curVal = tglSel.value;
  const map = new Map();
  for (const r of allRecords) {
    if (fBulan && r.bulan !== fBulan) continue;
    map.set(r.tanggal, r.tglSort);
  }
  const list = [...map.entries()].sort((a,b)=> a[1]-b[1]);
  tglSel.innerHTML = `<option value="">Semua</option>` +
    list.map(([label]) => `<option value="${label}">${label}</option>`).join("");
  if ([...tglSel.options].some(o => o.value === curVal)) tglSel.value = curVal;
}

function renderTabs() {
  const tabsEl = document.getElementById("tabs");
  const panelsEl = document.getElementById("panels");
  tabsEl.innerHTML = "";
  panelsEl.innerHTML = "";

  TABS.forEach((t, i) => {
    const tab = document.createElement("div");
    tab.className = "tab" + (i === 0 ? " active" : "");
    tab.textContent = t.label;
    tab.dataset.id = t.id;
    tab.onclick = () => {
      document.querySelectorAll(".tab").forEach(el => el.classList.toggle("active", el === tab));
      document.querySelectorAll(".panel").forEach(el => el.classList.toggle("active", el.id === "panel-" + t.id));
      renderTabIfNeeded(t.id);
    };
    tabsEl.appendChild(tab);

    const panel = document.createElement("div");
    panel.className = "panel" + (i === 0 ? " active" : "");
    panel.id = "panel-" + t.id;
    panel.innerHTML = `<div class="summary" id="sum-${t.id}"></div>
                       <div class="table-wrap" id="wrap-${t.id}"><div class="empty">Belum ada data. Upload file Excel dulu.</div></div>`;
    panelsEl.appendChild(panel);

    state.rendered[t.id] = false;
    state.dirty[t.id] = true;
    state.page[t.id] = 1;
  });
}

/* Render satu tab saja (dipakai lazy + saat paginasi) */
function renderTabIfNeeded(tabId) {
  if (!state.views) return;
  if (!state.rendered[tabId] || state.dirty[tabId]) {
    renderOneTab(tabId);
    state.rendered[tabId] = true;
    state.dirty[tabId] = false;
  }
}

function renderOneTab(tabId) {
  const t = TABS.find(x => x.id === tabId);
  const rows = state.views[VIEW_KEY[tabId]] || [];
  renderTable(tabId, t.cols, rows);

  const sumEl = document.getElementById("sum-" + tabId);
  const totalPay = rows.reduce((s, r) => s + (r.total_pembayaran || 0), 0);
  let extra = (tabId === "bulanan") ? ` • ${rows.length} bulan` : "";
  sumEl.textContent = `${fmt(rows.length)} baris${extra}` +
    (totalPay ? ` • Total pembayaran: Rp ${fmt(totalPay)}` : "");
}

function renderTable(tabId, cols, rows) {
  const wrap = document.getElementById("wrap-" + tabId);
  if (!rows || !rows.length) {
    wrap.innerHTML = `<div class="empty">Tidak ada data.</div>`;
    return;
  }

  /* Paginasi */
  const page = state.page[tabId] || 1;
  const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  const safePage = Math.min(page, totalPages);
  const start = (safePage - 1) * PAGE_SIZE;
  const slice = rows.slice(start, start + PAGE_SIZE);
  state.page[tabId] = safePage;

  /* Header */
  const thead = "<thead><tr>" +
    cols.map(c => `<th class="${NUM_COLS.has(c) ? "num" : ""}">${c}</th>`).join("") +
    "</tr></thead>";

  /* Body — pakai array + join (lebih cepat dari string concat berulang) */
  const parts = ["<tbody>"];
  for (let i = 0; i < slice.length; i++) {
    const r = slice[i];
    parts.push("<tr>");
    for (let j = 0; j < cols.length; j++) {
      const c = cols[j];
      const isNum = NUM_COLS.has(c);
      const v = r[c];
      parts.push(isNum
        ? `<td class="num">${fmt(v)}</td>`
        : `<td>${v ?? ""}</td>`);
    }
    parts.push("</tr>");
  }
  parts.push("</tbody>");

  /* Pager */
  let pager = "";
  if (totalPages > 1) {
    pager = `<div class="pager">
      <button data-pg="1" ${safePage === 1 ? "disabled" : ""}>« Awal</button>
      <button data-pg="${safePage - 1}" ${safePage === 1 ? "disabled" : ""}>‹ Prev</button>
      <span>Hal ${safePage} / ${totalPages}</span>
      <button data-pg="${safePage + 1}" ${safePage === totalPages ? "disabled" : ""}>Next ›</button>
      <button data-pg="${totalPages}" ${safePage === totalPages ? "disabled" : ""}>Akhir »</button>
      <span class="info">Menampilkan ${fmt(start + 1)}–${fmt(start + slice.length)} dari ${fmt(rows.length)} baris</span>
    </div>`;
  } else {
    pager = `<div class="pager"><span class="info">${fmt(rows.length)} baris</span></div>`;
  }

  wrap.innerHTML = `<table>${thead}${parts.join("")}</table>${pager}`;

  /* Event pager */
  wrap.querySelectorAll("button[data-pg]").forEach(b => {
    b.onclick = () => {
      const p = parseInt(b.dataset.pg, 10);
      if (!isNaN(p)) {
        state.page[tabId] = p;
        renderTable(tabId, cols, rows);
        wrap.scrollTop = 0;
      }
    };
  });
}

function updateStatus(msg) { document.getElementById("status").textContent = msg; }

function renderCards(records) {
  let totalFaktur = 0;
  let minyakCash = 0, minyakTransfer = 0;
  let rupaCash = 0, rupaTransfer = 0;
  let jml = 0;

  for (const r of records) {
    totalFaktur += r.tagihan_nominal || 0;
    minyakCash += r.minyak_cash || 0;
    minyakTransfer += r.minyak_transfer || 0;
    rupaCash += r.rupa_cash || 0;
    rupaTransfer += r.rupa_transfer || 0;
    jml++;
  }
  const totalMinyak = minyakCash + minyakTransfer;
  const totalRupa = rupaCash + rupaTransfer;
  const grand = totalMinyak + totalRupa;

  document.getElementById("cardFaktur").textContent = rp(totalFaktur);
  document.getElementById("cardFakturSub").textContent = `${fmt(jml)} transaksi`;

  document.getElementById("cardMinyak").textContent = rp(totalMinyak);
  document.getElementById("cardMinyakSub").textContent = `Cash: ${fmt(minyakCash)} • TF: ${fmt(minyakTransfer)}`;

  document.getElementById("cardRupa").textContent = rp(totalRupa);
  document.getElementById("cardRupaSub").textContent = `Cash: ${fmt(rupaCash)} • TF: ${fmt(rupaTransfer)}`;

  document.getElementById("cardGrand").textContent = rp(grand);
  document.getElementById("cardGrandSub").textContent = `Cash: ${fmt(minyakCash + rupaCash)} • TF: ${fmt(minyakTransfer + rupaTransfer)}`;
}

function renderAll() {
  const all = state.records;
  const filtered = applyFilter(all);

  /* Bangun ulang seluruh views — cepat, tidak sentuh DOM */
  state.views = buildViews(filtered);
  renderCards(filtered);

  /* Tandai semua tab dirty, reset paginasi */
  for (const t of TABS) {
    state.rendered[t.id] = false;
    state.dirty[t.id] = true;
    state.page[t.id] = 1;
  }

  /* Hanya render tab yang sedang aktif */
  const activeTab = document.querySelector(".tab.active");
  const activeId = activeTab ? activeTab.dataset.id : TABS[0].id;
  renderTabIfNeeded(activeId);

  document.getElementById("btnExport").disabled = false;
  const fB = document.getElementById("filterBulan").value || "Semua";
  const fT = document.getElementById("filterTanggal").value || "Semua";
  updateStatus(`${fmt(filtered.length)} transaksi (Bulan: ${fB}, Tanggal: ${fT})`);
}

function processFile(file) {
  updateStatus("Membaca file...");
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, { type: "array", cellDates: false });
      state.records = parseWorkbook(wb);
      /* Default: pilih bulan terakhir dari data yang ada */
      refreshFilterOptions(state.records, true);
      renderAll();
    } catch (err) {
      console.error(err);
      updateStatus("Gagal: " + err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

function exportExcel() {
  if (!state.views) return;
  const wb = XLSX.utils.book_new();
  const mapping = [
    ["Data Detail", "detail"],
    ["Rekap Harian", "harian"],
    ["Piutang Tempo", "piutang"],
    ["Cash Dropping", "dropping"],
    ["Rekap Minyak & Rupa2", "minyak"],
    ["Rekap per Toko", "toko"],
    ["Rekap Toko+Sales+Tanggal", "tokoSalesTgl"],
    ["Daftar Toko per Sales", "salesList"],
    ["Data Bulanan", "bulanan"],
  ];
  for (const [name, key] of mapping) {
    const rows = state.views[key];
    const ws = XLSX.utils.json_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));
  }
  const fB = document.getElementById("filterBulan").value || "Semua";
  const fT = document.getElementById("filterTanggal").value || "Semua";
  XLSX.writeFile(wb, `Rekap_UangMasuk_${fB}_${fT}.xlsx`);
}

/* ===== MENU DROPDOWN ===== */
const menuBtn = document.getElementById("menuBtn");
const menuDropdown = document.getElementById("menuDropdown");

menuBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  menuDropdown.classList.toggle("open");
});
document.addEventListener("click", (e) => {
  if (!menuDropdown.contains(e.target) && e.target !== menuBtn) {
    menuDropdown.classList.remove("open");
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") menuDropdown.classList.remove("open");
});

/* ===== EVENTS ===== */
document.getElementById("fileInput").addEventListener("change", e => {
  const f = e.target.files[0];
  if (f) processFile(f);
});
document.getElementById("filterBulan").addEventListener("change", () => {
  refreshTanggalOptions(state.records);
  renderAll();
});
document.getElementById("filterTanggal").addEventListener("change", renderAll);
document.getElementById("btnReset").addEventListener("click", () => {
  document.getElementById("filterBulan").value = "";
  refreshTanggalOptions(state.records);
  renderAll();
});
document.getElementById("btnExport").addEventListener("click", exportExcel);

renderTabs();
</script>
